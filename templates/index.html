<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 500px;">
        <h1 class="text-center mb-4">✅ Minhas Tarefas</h1>

        <!-- Formulário Adicionar -->
        <div class="card mb-4 shadow">
            <div class="card-body">
                <form action="/adicionar" method="POST">
                    <div class="input-group">
                        <input type="text" name="titulo" class="form-control" 
                               placeholder="Digite uma nova tarefa..." required>
                        <button type="submit" class="btn btn-primary">➕ Adicionar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Lista de Tarefas -->
        <div class="card shadow">
            <div class="card-body p-0">
                {% if tarefas %}
                <ul class="list-group list-group-flush">
                    {% for tarefa in tarefas %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <a href="/alternar/{{ tarefa[0] }}" class="text-decoration-none flex-grow-1">
                            {% if tarefa[2] == 1 %}
                            <span class="text-decoration-line-through text-muted">✅ {{ tarefa[1] }}</span>
                            {% else %}
                            <span>⬜ {{ tarefa[1] }}</span>
                            {% endif %}
                        </a>
                        <a href="/excluir/{{ tarefa[0] }}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Excluir esta tarefa?')">🗑️</a>
                    </li>
                    {% endfor %}
                </ul>
                {% else %}
                <p class="text-center text-muted py-4">Nenhuma tarefa ainda. Adicione uma acima! ✏️</p>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
